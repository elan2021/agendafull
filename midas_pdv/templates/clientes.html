<html><head>
        <meta charset="utf-8"/>
        <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
        <link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Plus+Jakarta+Sans%3Awght%40400%3B500%3B600%3B700%3B800" onload="this.rel='stylesheet'" rel="stylesheet"/>
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
        <title>Clientes - MidasPDV</title>
        <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        </head>
        <body class="bg-white">
        <div class="relative flex size-full min-h-screen flex-col group/design-root overflow-x-hidden" style='font-family: "Plus Jakarta Sans", "Noto Sans", sans-serif;'>
        <div class="layout-container flex h-full grow flex-col">
        <div class="px-4 md:px-10 lg:px-20 xl:px-40 flex flex-1 justify-center py-5">
        <div class="layout-content-container flex flex-col max-w-5xl flex-1">
        <div class="flex flex-wrap items-center justify-between gap-4 p-4">
        <h1 class="text-black tracking-tight text-3xl font-bold leading-tight">Clientes</h1>
        <!-- O botão de novo cliente pode ser adicionado aqui se houver uma rota para adicionar clientes pela interface -->
        <!-- <button class="flex items-center gap-2 rounded-md bg-black px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-gray-800 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-black transition-colors">
        <span class="material-icons text-xl">add</span>
                        Novo Cliente
                      </button> -->
        </div>
        <div class="px-4 py-3 @container">
        <div class="overflow-x-auto rounded-lg border border-gray-200 bg-white shadow-sm">
        <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
        <tr>
        <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider text-gray-700" scope="col">
                                Nome do Cliente
                              </th>
        <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider text-gray-700" scope="col">
                                Telefone
                              </th>
        <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider text-gray-700" scope="col">
                                Valor Gasto
                              </th>
        <th class="px-6 py-3 text-left text-xs font-semibold uppercase tracking-wider text-gray-700" scope="col">
                                Ações
                              </th>
        </tr>
        </thead>
        <tbody class="divide-y divide-gray-200 bg-white">
        {% for cliente in clientes %}
        <tr class="hover:bg-gray-50 transition-colors">
        <td class="whitespace-nowrap px-6 py-4 text-sm font-medium text-black">
                                {{ cliente.nome_cliente }}
                              </td>
        <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-600">
                                {{ cliente.telefone }}
                              </td>
        <td class="whitespace-nowrap px-6 py-4 text-sm text-gray-600">
                                R$ {{ "%.2f"|format(cliente.valor_gasto if cliente.valor_gasto else 0) }}
                              </td>
        <td class="whitespace-nowrap px-6 py-4 text-sm font-medium">
        <div class="flex items-center gap-2">
        <button class="flex items-center justify-center rounded-md p-2 text-black hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 transition-all">
        <span class="material-icons text-lg">edit</span>
        </button>
        <button class="flex items-center justify-center rounded-md p-2 text-black hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-black focus:ring-offset-2 transition-all">
        <span class="material-icons text-lg">delete</span>
        </button>
        </div>
        </td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4" class="text-center py-4 text-sm text-gray-500">Nenhum cliente cadastrado.</td>
        </tr>
        {% endfor %}
        </tbody>
        </table>
        </div>
        </div>
        </div>
        </div>
        </div>
        </div>
        </body></html>
